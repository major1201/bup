<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>bup - Ultimate Plumber for browser</title>
<style>
#content {
    font-family: monospace;
    margin-top: 50px;
}
.input-container-with-gap {
    display: flex;
    top: 10px;
    position: fixed;
    left: 5px;
    right: 5px;
    gap: 10px;
    margin-top: 0;
    z-index: 1000;
}
.input-container-with-gap .input-child {
    width: 50%;
    border: 3px solid #ccc;
    padding: 5px;
    box-sizing: border-box;
    font-size: 16px;
    font-size: medium;
    font-family: monospace;
}
</style>
</head>
<body>

<div class="input-container-with-gap">
    <input type="text" class="input-child" placeholder="Source Command, e.g. echo bup" id="srcCommand">
    <input type="text" class="input-child" placeholder="e.g. grep Ultimate | awk '{print $1}'" id="command" autofocus>
</div>

<pre id="content"></pre>

<script>
const protocol = document.location.protocol === 'https:' ? 'wss' : 'ws';
let ws;
let logTextArr = [];
const daemonMode = {{.DAEMON_MODE}} === "true";
const sessionId = (Math.random() + 1).toString(36).substring(7);

let input = document.getElementById("command");
input.addEventListener("keypress", function(event) {
    if (event.key === "Enter" && !event.shiftKey) {
        // Cancel the default action, if needed
        event.preventDefault();
        newConn(false);
    }
});

let srcInput = document.getElementById("srcCommand");
srcInput.addEventListener("keypress", function(event) {
    if (event.key === "Enter" && !event.shiftKey) {
        // Cancel the default action, if needed
        event.preventDefault();
        newConn(true);
    }
});

function hideSrcInput() {
    srcInput.style.display = 'none';
    input.style.width = "100%";
}

if (!daemonMode) {
    hideSrcInput();
} else {
    const urlParams = new URLSearchParams(window.location.search);
    const src = urlParams.get("src");
    srcInput.value = src;
    if (src == null || src === "") {
        input.blur();
        srcInput.focus();
    } else {
        hideSrcInput();
    }
}

newConn(true);

function newConn(updateSrc) {
    stopSession();

    // clear content
    let content = document.getElementById('content');
    logTextArr = [];
    content.innerHTML = '';

    // new connection
    let url = protocol + '://{{.WEBSOCKET_URI}}&command=' + encodeURIComponent(input.value);
    if (updateSrc) {
        url += '&srcCommand=' + encodeURIComponent(srcInput.value);
    }
    if (srcInput.value != "") {
        url += '&sessionId=' + sessionId;
    }

    ws = new WebSocket(url);
    ws.onmessage = function(event) {
        pushText(event.data);
    };
}

function pushText(text, isHtml) {
    if (!isHtml) {
        text = text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
    }
    let content = document.getElementById('content');
    logTextArr.push(text);
    content.innerHTML = logTextArr.join('');
}

function stopSession() {
    if (ws) {
        ws.close();
    }
}
</script>
</body>
</html>
